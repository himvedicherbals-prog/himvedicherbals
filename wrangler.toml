name = "himvedicherbals"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ==============================================================================
# D1 DATABASE BINDINGS
# ==============================================================================
# ⚠️ CRITICAL: After running `node scripts/init-databases.js`,
#    replace the placeholder IDs below with your actual database IDs.
# ==============================================================================

[[d1_databases]]
binding = "BLOG_DB"
database_name = "blog-db"
database_id = "PASTE_YOUR_BLOG_DB_ID_HERE"

[[d1_databases]]
binding = "USERS_DB"
database_name = "users-db"
database_id = "PASTE_YOUR_USERS_DB_ID_HERE"

# ==============================================================================
# ENVIRONMENT VARIABLES
# ==============================================================================

[vars]
SITE_NAME = "Trishanku Baba"
SITE_TAGLINE = "Premium Organic Gau Products & Medicinal Herbs from Nepal"
CONTACT_EMAIL = "your@email.com"
ADMIN_EMAIL = "admin@himvedicherbals.com"
JWT_SECRET = "CHANGE-THIS-TO-A-RANDOM-32-CHAR-STRING-NOW"
SESSION_EXPIRY_DAYS = "30"
CORS_ORIGIN = "*"

# ==============================================================================
# DEVELOPMENT (local) OVERRIDES
# ==============================================================================

[env.dev]
name = "himvedicherbals-dev"

[env.dev.vars]
SITE_NAME = "Trishanku Baba (Dev)"
JWT_SECRET = "dev-secret-change-in-production-only"

# ==============================================================================
# PRODUCTION OVERRIDES
# ==============================================================================

[env.production]
name = "himvedicherbals"

# For production secrets, use:
#   wrangler secret put JWT_SECRET --env production
# instead of putting them here.